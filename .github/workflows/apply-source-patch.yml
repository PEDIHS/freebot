name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/trigger-2.7'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make transfer command replacements unambiguous
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('patches/apply_2_7_0.py')
          text = path.read_text(encoding='utf-8')
          needle = '''replace_once(
              "media.php",
              "'--session',$scanner['session_base'],'--config',$runtime['config'],'--result-file',$resultFile];",
              "'--session',$scanner['session_base'],'--parallel-session','--config',$runtime['config'],'--result-file',$resultFile];",
          )'''
          if text.count(needle) != 2:
              raise SystemExit(f'expected two generic transfer command replacements, found {text.count(needle)}')
          download = '''replace_once(
              "media.php",
              "$command=[$runtime['python'],$runtime['script'],'--download-message','--channel',(string)$resolved['chat_id'],'--message-id',(string)$resolved['message_id'],'--output',$target,'--session',$scanner['session_base'],'--config',$runtime['config'],'--result-file',$resultFile];",
              "$command=[$runtime['python'],$runtime['script'],'--download-message','--channel',(string)$resolved['chat_id'],'--message-id',(string)$resolved['message_id'],'--output',$target,'--session',$scanner['session_base'],'--parallel-session','--config',$runtime['config'],'--result-file',$resultFile];",
          )'''
          upload = '''replace_once(
              "media.php",
              "$command=[$runtime['python'],$runtime['script'],'--upload-file',$path,'--destination',$target,'--session',$scanner['session_base'],'--config',$runtime['config'],'--result-file',$resultFile];",
              "$command=[$runtime['python'],$runtime['script'],'--upload-file',$path,'--destination',$target,'--session',$scanner['session_base'],'--parallel-session','--config',$runtime['config'],'--result-file',$resultFile];",
          )'''
          text = text.replace(needle, download, 1)
          text = text.replace(needle, upload, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply guarded source migration
        run: python3 patches/apply_2_7_0.py
      - name: Validate changed files
        run: |
          python3 -m py_compile scripts/channel_history_scan.py
          php -l media.php
          bash -n install.sh update.sh
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.php scripts/channel_history_scan.py install.sh update.sh VERSION tests/installer_test.sh
          git commit -m "Release 2.7.0 parallel media workers"
          git push origin HEAD:main
