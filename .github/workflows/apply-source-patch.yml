name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix_queue_state_2_8_runtime.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime migration hardening
        run: python3 patches/fix_queue_state_2_8_runtime.py
      - name: Validate changed files
        run: |
          php -l app.php
          bash -n update.sh tests/installer_test.sh
          shellcheck -x update.sh tests/installer_test.sh
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.php update.sh tests/installer_test.sh
          git commit -m "Make queue-state migration safe at runtime"
          git push origin HEAD:main
