name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix_collation_2_8_1.py'
      - 'patches/trigger-collation-2.8.1'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply collation-safe queue repair
        run: python3 patches/fix_collation_2_8_1.py
      - name: Validate changed files
        run: |
          php -l media.php
          php -l tests/queue_test.php
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.php tests/queue_test.php VERSION
          git commit -m "Make Telegram queue SQL collation-safe"
          git push origin HEAD:main
