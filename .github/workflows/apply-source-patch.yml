name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix_explicit_video_thumbnails.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply explicit thumbnail fix
        run: python3 patches/fix_explicit_video_thumbnails.py
      - name: Validate changed files
        run: |
          python3 -m py_compile scripts/channel_history_scan.py
          python3 scripts/channel_history_scan.py --self-test
          php -l media.php
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/channel_history_scan.py media.php VERSION
          git commit -m "Fix Telegram video thumbnails and covers"
          git push origin HEAD:main
