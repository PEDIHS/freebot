name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix_cancelled_pipeline_2_8.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cancelled queue pipeline repair
        run: python3 patches/fix_cancelled_pipeline_2_8.py
      - name: Validate changed files
        run: |
          php -l app.php
          php -l media.php
          php -l tests/queue_test.php
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.php media.php tests/queue_test.php
          git commit -m "Upgrade cancelled Telegram queues before resume"
          git push origin HEAD:main
