name: Apply FreeBot source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/fix_queue_state_2_8.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queue state hardening
        run: python3 patches/fix_queue_state_2_8.py
      - name: Validate changed files
        run: |
          php -l app.php
          php -l media.php
          php -l admin.php
          php -l tests/queue_test.php
          bash -n update.sh healthcheck.sh tests/installer_test.sh
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.php media.php admin.php update.sh healthcheck.sh VERSION tests/queue_test.php tests/installer_test.sh
          git commit -m "Harden Telegram queue state and resume logic"
          git push origin HEAD:main
